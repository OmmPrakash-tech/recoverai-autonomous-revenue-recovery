<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>RecoverAI Payment Test</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
        }

        button {
            padding: 14px 30px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            white-space: pre-wrap;
            text-align: left;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

<h1>RecoverAI Payment Test</h1>

<p>Test Razorpay payment</p>

<h2>₹500</h2>

<button onclick="startPayment()">
    Pay ₹500
</button>

<div id="result">
    Waiting for payment...
</div>


<script>

async function startPayment() {

    const resultBox =
        document.getElementById("result");

    try {

        resultBox.textContent =
            "Creating Razorpay order...";


        // =========================================
        // 1. CREATE RAZORPAY ORDER
        // =========================================

        const orderResponse =
            await fetch(
                "/api/v1/revenue/orders?amount=500&currency=INR",
                {
                    method: "POST"
                }
            );


        if (!orderResponse.ok) {

            throw new Error(
                "Order creation failed. HTTP " +
                orderResponse.status
            );
        }


        const order =
            await orderResponse.json();


        console.log("Razorpay Order:", order);


        resultBox.textContent =
            "Order created\n\n" +
            "Order ID: " + order.orderId +
            "\nAmount: ₹" +
            (order.amount / 100) +
            "\nCurrency: " +
            order.currency +
            "\n\nOpening Razorpay...";


        // =========================================
        // 2. OPEN RAZORPAY CHECKOUT
        // =========================================

        const options = {

            key: order.keyId,

            amount: order.amount,

            currency: order.currency,

            name: "RecoverAI",

            description:
                "Revenue Recovery Test Payment",

            order_id: order.orderId,


            // =====================================
            // SUCCESSFUL PAYMENT
            // =====================================

            handler: async function (response) {

                console.log(
                    "========== PAYMENT SUCCESS =========="
                );

                console.log(
                    "Order ID:",
                    response.razorpay_order_id
                );

                console.log(
                    "Payment ID:",
                    response.razorpay_payment_id
                );

                console.log(
                    "Signature:",
                    response.razorpay_signature
                );


                resultBox.textContent =
                    "PAYMENT SUCCESSFUL\n\n" +

                    "Order ID:\n" +
                    response.razorpay_order_id +

                    "\n\nPayment ID:\n" +
                    response.razorpay_payment_id +

                    "\n\nVerifying Razorpay signature...";


                // Verify successful payment
                await verifyPayment(response);
            }
        };


        const razorpay =
            new Razorpay(options);


        // =========================================
        // FAILED PAYMENT
        // =========================================

        razorpay.on(
            "payment.failed",
            async function (response) {

                console.log(
                    "========== PAYMENT FAILED =========="
                );

                console.log(response);


                const paymentId =
                    response.error
                        ?.metadata
                        ?.payment_id;


                const failureReason =
                    response.error
                        ?.description ||
                    "Unknown payment failure";


                resultBox.textContent =
                    "PAYMENT FAILED\n\n" +

                    "Payment ID:\n" +
                    (paymentId || "Not available") +

                    "\n\nReason:\n" +
                    failureReason +

                    "\n\nSending failure to RecoverAI...";


                // =================================
                // SEND FAILED PAYMENT TO RECOVERAI
                // =================================

                if (!paymentId) {

                    resultBox.textContent +=
                        "\n\nNo Razorpay Payment ID received.";

                    return;
                }


                await processFailedPayment(
                    paymentId,
                    failureReason
                );
            }
        );


        razorpay.open();

    } catch (error) {

        console.error(error);

        resultBox.textContent =
            "ERROR\n\n" +
            error.message;
    }
}


// =============================================
// VERIFY SUCCESSFUL PAYMENT SIGNATURE
// =============================================

async function verifyPayment(payment) {

    const resultBox =
        document.getElementById("result");


    try {

        const verificationResponse =
            await fetch(
                "/api/v1/revenue/payments/verify",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        razorpay_order_id:
                            payment.razorpay_order_id,

                        razorpay_payment_id:
                            payment.razorpay_payment_id,

                        razorpay_signature:
                            payment.razorpay_signature
                    })
                }
            );


        const result =
            await verificationResponse.text();


        console.log(
            "Verification HTTP status:",
            verificationResponse.status
        );

        console.log(
            "Verification result:",
            result
        );


        if (!verificationResponse.ok) {

            resultBox.textContent =
                "PAYMENT RECEIVED\n\n" +

                "Signature verification FAILED\n\n" +

                "HTTP Status: " +
                verificationResponse.status +

                "\n\nBackend response:\n" +
                result;

            return;
        }


        resultBox.textContent =
            "✅ PAYMENT VERIFIED SUCCESSFULLY\n\n" +
            result;


    } catch (error) {

        console.error(error);

        resultBox.textContent =
            "Verification request failed:\n\n" +
            error.message;
    }
}


// =============================================
// PROCESS FAILED PAYMENT
// =============================================

async function processFailedPayment(
    paymentId,
    failureReason
) {

    const resultBox =
        document.getElementById("result");


    try {

        const eventData = {

            event_id:
                "PAY_" + Date.now(),

            razorpay_payment_id:
                paymentId,

            customer_id:
                "CUST_TEST_001",

            amount:
                500,

            currency:
                "INR",

            event_type:
                "payment_failed",

            reason:
                failureReason
        };


        console.log(
            "Sending recovery event:",
            eventData
        );


        const response =
            await fetch(
                "/api/v1/revenue/events",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(eventData)
                }
            );


        const result =
            await response.text();


        console.log(
            "RecoverAI HTTP status:",
            response.status
        );

        console.log(
            "RecoverAI response:",
            result
        );


        if (!response.ok) {

            resultBox.textContent =
                "PAYMENT FAILED\n\n" +

                "Payment ID:\n" +
                paymentId +

                "\n\nRecovery workflow ERROR\n\n" +

                "HTTP Status: " +
                response.status +

                "\n\nBackend response:\n" +
                result;

            return;
        }


        resultBox.textContent =
            "🚨 PAYMENT FAILED\n\n" +

            "Payment ID:\n" +
            paymentId +

            "\n\n" +

            "✅ RECOVERAI PROCESSED THE FAILURE\n\n" +

            result;


    } catch (error) {

        console.error(error);

        resultBox.textContent =
            "Payment failed, but RecoverAI request failed:\n\n" +
            error.message;
    }
}

</script>

</body>

</html>
